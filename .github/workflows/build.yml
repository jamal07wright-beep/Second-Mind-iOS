# Builds Second-Mind on a free GitHub Mac, tests it against Meta's mock
# glasses, and only then makes an unsigned .ipa for Sideloadly.
name: Build Second-Mind

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make the Xcode project
        run: xcodegen generate

      - name: Check settings (free Apple ID safe)
        run: bash scripts/check-settings.sh

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py)
          echo "Simulator: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Compile app and tests
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project SecondMind.xcodeproj \
            -scheme SecondMind \
            -destination "platform=iOS Simulator,id=$UDID,arch=arm64" \
            -derivedDataPath dd \
            | tee compile.log | grep --line-buffered -E "(error:|\*\* TEST BUILD|Resolve Package|Fetching)"

      - name: Test reading logic and word finding
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project SecondMind.xcodeproj \
            -scheme SecondMind \
            -destination "platform=iOS Simulator,id=$UDID,arch=arm64" \
            -derivedDataPath dd \
            -resultBundlePath LogicResults.xcresult \
            -only-testing:SecondMindTests/StillnessDetectorTests \
            -only-testing:SecondMindTests/TextToolsTests \
            -only-testing:SecondMindTests/TextRecognizerTests \
            -only-testing:SecondMindTests/TurnDetectorTests \
            -only-testing:SecondMindTests/MoodDetectorTests \
            -only-testing:SecondMindTests/ChimeTests \
            -only-testing:SecondMindTests/MathEngineTests \
            -only-testing:SecondMindTests/DayGraphTests \
            -only-testing:SecondMindTests/RequestTests \
            -only-testing:SecondMindTests/VoiceAndStoreTests \
            -only-testing:SecondMindTests/Update3Tests \
            -only-testing:SecondMindTests/VoiceProfileTests \
            -only-testing:SecondMindTests/Update4Tests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            | tee logic.log | grep --line-buffered -E "(Test Case|error:|\*\* TEST)"

      - name: Test with mock glasses
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project SecondMind.xcodeproj \
            -scheme SecondMind \
            -destination "platform=iOS Simulator,id=$UDID,arch=arm64" \
            -derivedDataPath dd \
            -resultBundlePath TestResults.xcresult \
            -only-testing:SecondMindTests/MockGlassesReadingTests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            | tee test.log | grep --line-buffered -E "(Test Case|Test Suite|error:|\*\* TEST|Testing started|SecondMindTest)"

      - name: Show end of logs if something failed
        if: failure() || cancelled()
        run: |
          echo "=== compile.log ==="; tail -n 80 compile.log 2>/dev/null || true
          echo "=== test.log ==="; tail -n 150 test.log 2>/dev/null || true

      - name: Save test results if something failed
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            compile.log
            test.log
          retention-days: 7

      - name: Build unsigned app for iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project SecondMind.xcodeproj \
            -scheme SecondMind \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep --line-buffered -E "(error:|\*\* BUILD)"

      - name: Check the finished app
        run: bash scripts/check-app.sh build/Build/Products/Release-iphoneos/SecondMind.app

      - name: Package .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SecondMind.app Payload/
          zip -qry SecondMind.ipa Payload
          ls -lh SecondMind.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: SecondMind-ipa
          path: SecondMind.ipa
          retention-days: 30
