# XcodeGen spec. The GitHub Mac runs `xcodegen generate` to make SecondMind.xcodeproj,
# so the project file never has to be edited by hand on Windows.
name: SecondMind
options:
  bundleIdPrefix: com.secondmind
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    TARGETED_DEVICE_FAMILY: "1"
    # Simulator builds sign locally; device builds are made unsigned for Sideloadly.
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  SecondMind:
    type: application
    platform: iOS
    sources:
      - path: SecondMind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.secondmind.app
        PRODUCT_NAME: SecondMind
        INFOPLIST_FILE: SecondMind/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Developer Mode in the Meta AI app means these stay empty (no attestation).
        META_APP_ID: ""
        CLIENT_TOKEN: ""
        # No entitlements file on purpose. Free Apple IDs can't use Hotspot or
        # Wi-Fi Info, and an explicit keychain group can break after Sideloadly re-signs.
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATMockDevice
    scheme:
      testTargets:
        - SecondMindTests

  SecondMindTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SecondMindTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.secondmind.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SecondMind
